<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온편집 Host API 예제</title>
<script type="module" src="/host.mjs"></script>
</head>
<body>
<h1>온편집 Host API 예제</h1>
<button id="connect">편집기 연결</button>
<fieldset id="actions" disabled>
  <button id="markdown">Markdown 문서 검토</button>
  <button id="spec">DocumentSpec 문서 검토</button>
  <label>열 파일 <input id="source" type="file" accept=".hwp,.hwpx"></label>
  <button id="open">파일 열기 검토</button>
  <button id="capture">선택 고정</button>
  <button id="suggest">수정 제안 검토</button>
  <button id="undo">되돌리기</button>
  <button id="redo">다시 실행</button>
  <button id="download">HWPX 다운로드</button>
</fieldset>
<p>편집기에서 한 문단 또는 셀 안의 글자를 선택하고 ‘선택 고정’을 누르세요. 예제는 실제 AI 대신 고정 규칙으로 수정안을 만듭니다.</p>
<p id="status" role="status">편집기가 표시되면 연결을 누르세요.</p>
<dialog id="review" aria-labelledby="review-title">
  <h2 id="review-title"></h2>
  <pre id="preview"></pre>
  <form method="dialog">
    <button value="cancel" autofocus>취소</button>
    <button value="approve">승인</button>
  </form>
</dialog>
<iframe id="editor" title="온편집 편집기" style="width:100%;height:770px;border:1px solid #aaa"></iframe>
</body>
</html>
